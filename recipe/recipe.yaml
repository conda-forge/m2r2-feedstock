schema_version: 1

context:
  name: m2r2
  version: "2.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/m2r2-${{ version }}.tar.gz
  sha256: f6756b22b4ba4ec0b5e9d8b643503ef896e1c5688b577f77f471dca6cd87e10d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - m2r2 = m2r2.cli.m2r2:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - mistune >=3.0,<3.3
    - docutils >=0.19

tests:
  - python:
      imports:
        - m2r2
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - m2r2 --help

about:
  summary: Markdown and reStructuredText in a single file.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/crossnox/m2r2

extra:
  recipe-maintainers:
    - basnijholt
    - xylar
